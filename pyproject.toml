[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "oxocr"
version = "0.1.1"
description = "Lightweight Python OCR library on ONNX Runtime with 45 built-in models (PaddleOCR, DuGuang, Indra, formula recognition), no OpenCV dependency / 基于 ONNX Runtime 的轻量级 Python OCR 库，内置 PaddleOCR、读光、Indra、公式识别等 45 个模型，无 OpenCV 依赖"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "luckycucu" }]
keywords = ["ocr", "onnx", "pp-ocr", "text-recognition"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "onnxruntime>=1.16",
    "pyclipper>=1.3",
    "upolygon>=0.1",
    "modelscope-hub>=0.7",
    "huggingface-hub>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "opencv-python-headless", # 仅作 imageops 对照，运行期不依赖
]

[project.scripts]
oxocr = "oxocr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["oxocr"]

[tool.pytest.ini_options]
testpaths = ["test"]
markers = [
    "model: 需要本地 ONNX 模型权重（test/models，离线）",
    "integration: 集成测试（常驻池 / 子进程 / 真实模型）",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["oxocr", "test"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501", # 由 formatter 兜底
    "B008", # 函数默认值中的 field() 等调用
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true